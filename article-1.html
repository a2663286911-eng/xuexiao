      <button class="menu-toggle" aria-label="菜单"><span></span><span></span><span></span></button>
    </div>
  </header>
  <div class="nav-overlay"></div>
  <nav class="mobile-nav" aria-label="移动端导航">
    <ul class="mobile-nav-list">
      <li><a href="index.html">首页</a></li>
      <li><a href="registration.html">开学报到</a></li>

    </ul>
  </nav>

  <main id="main-content">
    <div class="container">
      <nav class="breadcrumb" id="article-breadcrumb">
        <a href="index.html">首页</a><span class="separator">›</span><a href="search.html">攻略</a><span class="separator">›</span><span id="breadcrumb-title">文章详情</span>
      </nav>
    </div>

    <section class="section">
      <div class="container" style="max-width:800px;">
        <div id="article-content">
          <div class="loading-state"><span class="icon">⏳</span><p>加载文章中…</p></div>
        </div>

        <!-- Conversion -->
        <div class="conversion-box" id="article-conversion">
          <h3>📦 还需要这些新生资料吗？</h3>
          <ul class="feature-list">
            <li>✅ 可保存的新生清单</li>
            <li>🔔 后续报到更新</li>
            <li>❓ 新生问题答疑</li>
            <li>👥 学生交流渠道</li>
          </ul>
          <a href="contact.html" class="btn btn-primary">查看领取方式 →</a>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <div class="mobile-bottom-bar no-print">
    <a href="contact.html" class="btn btn-primary btn-sm">📦 领取新生资料</a>
    <button class="btn-close" aria-label="关闭">✕</button>
  </div>

  <script src="static/js/data-loader.js"></script>
  <script src="static/js/main.js"></script>
  <script src="static/js/analytics.js"></script>
  <script>
    (async function() {
      const id = getParam('id') || '1';
      const container = document.getElementById('article-content');
      const breadcrumbTitle = document.getElementById('breadcrumb-title');

      if (!id) {
        container.innerHTML = '<div class="error-state"><span class="icon">📄</span><h3>未指定文章</h3><p>请从首页或搜索页面选择一篇文章。</p><a href="index.html" class="btn btn-primary mt-2">返回首页</a></div>';
        return;
      }

      const articles = await DataLoader.getArticles();
      if (!articles || !Array.isArray(articles)) {
        container.innerHTML = '<div class="error-state"><span class="icon">⚠️</span><p>文章数据加载失败</p></div>';
        return;
      }

      const article = articles.find(a => a.id === id);

      if (!article) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="icon">🔍</span>
            <h3>文章未找到</h3>
            <p>ID: ${escapeHtml(id)}</p>
            <a href="index.html" class="btn btn-primary mt-2">返回首页</a>
          </div>
        `;
        return;
      }

      // 更新标题和meta
      document.title = article.title + ' — 移通新生指南';
      document.querySelector('meta[name="description"]').content = article.summary;
      document.querySelector('meta[property="og:title"]').content = article.title + ' — 移通新生指南';
      document.querySelector('meta[property="og:description"]').content = article.summary;

      breadcrumbTitle.textContent = article.title;

      container.innerHTML = `
        <article>
          <header class="mb-3">
            <div class="text-muted text-small mb-1">${article.categoryName} · ${article.campus === 'all' ? '全部校区' : article.campus} · ${article.grade || ''}</div>
            <h1>${article.coverIcon || ''} ${article.title}</h1>
            <p class="text-muted">${article.summary}</p>
            <div class="article-card-meta" style="margin-top:12px;">
              ${renderMeta(article)}
              <span>⏱ ${escapeHtml(article.readTime)}</span>
            </div>
          </header>
          <div class="article-content">
            ${article.content}
          </div>
        </article>
      `;
    })();
  </script>
</body>
</html>
