    <section class="section">
      <div class="container" style="max-width:800px;">
        <div class="search-box mb-3" style="max-width:100%;">
          <form id="search-form" role="search">
            <label for="search-input" class="sr-only">搜索</label>
            <input type="search" id="search-input" name="q" placeholder="搜索宿舍、军训、校园卡、快递地址、专业或校区……">
            <button type="submit" aria-label="搜索">🔍</button>
          </form>
        </div>

        <div id="search-results">
          <p class="text-muted text-center">输入关键词开始搜索</p>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

    <a href="contact.html" class="btn btn-primary btn-sm">📦 领取新生资料</a>

  <script src="static/js/data-loader.js"></script>
  <script src="static/js/main.js"></script>
  <script src="static/js/search.js"></script>
  <script src="static/js/analytics.js"></script>
  <script>
    (async function() {
      const input = document.getElementById('search-input');
      const form = document.getElementById('search-form');
      const results = document.getElementById('search-results');
      const q = getParam('q');

      async function doSearch(query) {
        if (!query) {
          results.innerHTML = '<p class="text-muted text-center">输入关键词开始搜索</p>';
          return;
        }
        results.innerHTML = '<div class="loading-state"><span class="icon">🔍</span><p>搜索中…</p></div>';
        const data = await SearchEngine.search(query);
        SearchEngine.renderResults(data, query, results);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (query) {
          // Update URL without reload
          const url = new URL(window.location);
          url.searchParams.set('q', query);
          window.history.replaceState({}, '', url);
          doSearch(query);
        }
      });

      if (q) {
        input.value = q;
        doSearch(q);
      }
    })();
  </script>
